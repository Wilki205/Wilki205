# Nome do Workflow
name: Generate Snake Animation

# Eventos que disparam a automação
on:
  schedule:
    # Roda todo dia às 12:00 UTC (9h da manhã no seu fuso)
    - cron: '0 12 * * *'
  # Permite que você rode manualmente pela aba "Actions"
  workflow_dispatch:

# Tarefas que serão executadas
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # Passo 1: Clona seu repositório para a máquina da automação
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Passo 2: Gera a animação da cobra
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Passo 3: Faz o commit e push dos arquivos gerados para o seu repositório
      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update snake animation"
          branch: main
          file_pattern: dist/*.svg
